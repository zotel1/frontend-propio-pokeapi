<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pokédex — ISFD</title>

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/pokedex.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>
  <main class="app">
    <section class="pokedex">

      <!-- Cabecera física -->
      <header class="pokedex__header">

        <div class="pokedex__lights">
          <div
            class="status-light status-light--main"
            id="backend-status"
            title="Estado del backend"
          ></div>

          <div class="status-light status-light--red"></div>
          <div class="status-light status-light--yellow"></div>
          <div class="status-light status-light--green"></div>
        </div>

        <div class="pokedex__branding">
          <h1>POKÉDEX — ISFD</h1>

          <img
            class="pokedex__logo"
            src="./assets/images/logo.jpeg"
            alt="Logo Desarrollo de Software ISFD"
          >
        </div>

      </header>

      <!-- Pantalla -->
      <section class="pokedex__screen">

        <!-- Buscador -->
        <form
          class="search"
          id="search-form"
        >
          <input
            id="search-input"
            class="search__input"
            type="search"
            placeholder="Buscar Pokémon..."
            autocomplete="off"
            aria-label="Buscar Pokémon por nombre"
          >

          <button
            class="search__button"
            type="submit"
            aria-label="Buscar Pokémon"
          >
            🔍
          </button>
        </form>

        <!-- Contenido dinámico -->
        <section
          class="screen-content"
          id="screen-content"
          aria-live="polite"
        >
          <div class="loading">
            <p>Iniciando Pokédex...</p>
          </div>
        </section>

      </section>

      <!-- Navegación principal -->
      <nav
        class="pokedex__navigation"
        aria-label="Navegación principal"
      >

        <button
          class="nav-button nav-button--active"
          id="nav-home"
          data-view="home"
          type="button"
        >
          Inicio
        </button>

        <button
          class="nav-button"
          id="nav-types"
          data-view="types"
          type="button"
        >
          Tipos
        </button>

        <button
          class="nav-button"
          id="nav-collection"
          data-view="collection"
          type="button"
        >
          Colección
        </button>

      </nav>

      <!-- Controles físicos -->
      <footer class="pokedex__controls">

        <div
          class="dpad"
          aria-hidden="true"
        >
          <span class="dpad__vertical"></span>
          <span class="dpad__horizontal"></span>
        </div>

        <div class="action-buttons">
          <button
            class="action-button action-button--a"
            type="button"
            aria-label="Botón A"
          >
            A
          </button>

          <button
            class="action-button action-button--b"
            type="button"
            aria-label="Botón B"
          >
            B
          </button>
        </div>

      </footer>

    </section>
  </main>

  <script
    type="module"
    src="./js/app.js"
  ></script>
</body>
</html>
